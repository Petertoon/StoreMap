<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Find a Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #113c2a;           /* page background */
      --maroon: #7e231a;       /* header bars, borders, Menu button */
      --cream: #fbf0df;        /* dropdowns and rows */
      --green: #1c5a1f;        /* restaurant names */
      --line: #cdbfa8;         /* lines between rows */
      --ink: #2b2b2b;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); font-family: "Montserrat", system-ui, -apple-system, sans-serif; color: var(--ink); }
    body { padding: 12px 12px 28px; }
    svg { display: block; }

    /* ---- top buttons ---- */
    .top-row { display: flex; gap: 12px; align-items: stretch; }
    .top-row > * { flex: 1; min-width: 0; }
    .select-wrap { position: relative; }
    .btn-region, .btn-map {
      display: flex; align-items: center; gap: 8px; width: 100%; height: 100%; min-height: 64px; padding: 8px 10px; border-radius: 22px;
      font: 800 17px/1.05 "Montserrat", system-ui, sans-serif; text-decoration: none; cursor: pointer; text-align: left;
    }
    .btn-region { background: linear-gradient(#fdf4e4, #f1e2c8); color: #7e231a; border: 3px solid #c5532b; box-shadow: 0 0 0 2px #f0d9bd, 0 3px 8px rgba(0,0,0,.4); }
    .btn-map { background: linear-gradient(#2f8c3a, #1c5e22); color: #fff; border: 3px solid #eadcc2; box-shadow: 0 3px 8px rgba(0,0,0,.4); justify-content: center; }
    .btn-region .ico, .btn-map .ico { width: 32px; height: 32px; flex: none; }
    .btn-region .label { flex: 1; }
    .btn-region .chev, .btn-map .chev { width: 20px; height: 20px; flex: none; }
    .btn-region[aria-expanded="true"] .chev { transform: rotate(180deg); }

    #hero { display: none; margin: 12px -12px 0; height: 66px; background-size: cover; background-position: center; }
    #hero.show { display: block; }

    .title { display: flex; align-items: center; gap: 12px; color: #fff; font-size: 26px; font-weight: 800; margin: 14px 2px 12px; justify-content: center; }
    .title::before, .title::after { content: ""; flex: 1; height: 2px; background: rgba(255,255,255,.65); }
    .title svg { width: 32px; height: 32px; flex: none; }

    /* ---- dropdowns ---- */
    #city-btn {
      width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 18px; background: linear-gradient(#fdf4e4, #f1e2c8);
      border: 3px solid var(--maroon); box-shadow: 0 0 0 2px #f1dcc0, 0 3px 8px rgba(0,0,0,.35); border-radius: 30px; font: 800 22px "Montserrat", system-ui, sans-serif; color: var(--maroon); cursor: pointer; text-align: left;
    }
    #city-btn svg.icon { width: 32px; height: 32px; flex: none; }
    #city-btn .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #city-btn .chev { width: 28px; height: 28px; flex: none; transition: transform .15s; }
    #city-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }
    .dd-list {
      display: none; position: absolute; left: 6px; right: 6px; top: calc(100% + 6px); z-index: 20; margin: 0; padding: 6px; list-style: none;
      background: var(--cream); border-radius: 16px; box-shadow: 0 6px 20px rgba(0,0,0,.5); max-height: 340px; overflow-y: auto;
    }
    .dd-list.open { display: block; }
    .dd-list li { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 10px; font-size: 18px; font-weight: 700; color: #3a2a26; cursor: pointer; }
    .dd-list li svg { width: 22px; height: 22px; flex: none; color: var(--maroon); }
    .dd-list li.sel { background: var(--maroon); color: #fff; }
    .dd-list li.sel svg { color: #fff; }
    #region-list { left: 0; right: -40px; }

    #areas { display: none; flex-wrap: wrap; gap: 8px; margin: 12px 2px 0; }
    #areas.show { display: flex; }
    #areas button { border: 2px solid var(--cream); background: transparent; color: var(--cream); border-radius: 20px; padding: 7px 14px; font: 700 14px "Montserrat", system-ui, sans-serif; cursor: pointer; }
    #areas button.sel { background: var(--cream); color: var(--maroon); }

    /* ---- results ---- */
    .results { margin-top: 16px; background: var(--cream); border: 3px solid var(--cream); border-radius: 22px; overflow: hidden; box-shadow: 0 2px 10px rgba(0,0,0,.35); }
    .results-head { display: flex; align-items: center; gap: 12px; background: linear-gradient(#8f2a1f, #741f17); color: #fff; padding: 10px 12px; border-radius: 18px 18px 0 0; }
    .results-head svg { width: 32px; height: 32px; flex: none; }
    .results-head h2 { flex: 1; margin: 0; font-size: 19px; font-weight: 800; line-height: 1.15; }
    .count { flex: none; background: #fff; color: #222; border-radius: 18px; padding: 6px 12px; font-size: 14px; font-weight: 700; }

    .rest { border-top: 1px solid var(--line); }
    .rest:first-child { border-top: 0; }
    .rest.open { border: 3px solid #2e7d32; border-radius: 18px; margin: 6px 5px; background: #fff7e8; }
    .rest-head { display: flex; align-items: center; gap: 14px; padding: 8px 12px; cursor: pointer; }
    .rest.open .rest-head { padding-bottom: 6px; }
    .thumb { flex: none; width: 88px; height: 58px; border-radius: 11px; overflow: hidden; background: #d8cdb9; display: flex; align-items: center; justify-content: center; font-size: 26px; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .info { flex: 1; min-width: 0; }
    .name { font-size: 17px; font-weight: 800; color: var(--green); line-height: 1.12; letter-spacing: -.2px; }
    .where { display: flex; align-items: center; gap: 6px; margin-top: 3px; font-size: 15px; font-weight: 500; color: #2b2b2b; }
    .where svg { width: 16px; height: 16px; flex: none; color: var(--green); }
    .rest-head .chev { width: 28px; height: 28px; flex: none; color: var(--green); }

    .acts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 4px 8px 10px; }
    .act {
      display: flex; align-items: center; justify-content: center; gap: 4px; padding: 10px 3px; border-radius: 12px; text-decoration: none; color: #fff;
      font: 800 12px/1.1 "Montserrat", system-ui, sans-serif; text-align: left; min-height: 46px; box-shadow: 0 2px 4px rgba(0,0,0,.25);
    }
    .act svg { width: 19px; height: 19px; flex: none; }
    .act.info { background: linear-gradient(#9a2d20, #741f17); }
    .act.call { background: linear-gradient(#2f8c3a, #1c5e22); }
    .act.dir { background: linear-gradient(#c8741f, #a35a14); }
    .act.off { opacity: .38; box-shadow: none; filter: grayscale(.4); cursor: default; }
    @media (min-width: 460px) { .act { font-size: 14px; gap: 8px; } .act svg { width: 24px; height: 24px; } }

    .brand { display: flex; align-items: center; gap: 12px; margin: -12px -12px 0; padding: 14px 16px; min-height: 96px; color: #fbf0df; background: #0e2f20 center/cover no-repeat; }
    .brand svg { width: 64px; height: 64px; flex: none; color: #fbf0df; }
    .brand b { display: block; font-size: 38px; font-weight: 800; line-height: 1; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
    .brand i { display: block; font-size: 14px; font-weight: 600; margin-top: 4px; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
    .top-row { margin-top: 12px; }
    .btn-region, .btn-map, #city-btn.small { font-size: 15px; }
    .btn-map small { display: block; font-size: 11px; font-weight: 600; }
    .group-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
    .group { display: flex; align-items: center; gap: 8px; padding: 14px 10px; border-radius: 22px; background: linear-gradient(#fdf4e4,#ecd9b8); border: 3px solid #eadcc2; box-shadow: 0 3px 8px rgba(0,0,0,.4); color: #1d1d1d; font: 800 20px/1.05 "Montserrat", system-ui, sans-serif; cursor: pointer; text-align: left; }
    .group svg.g { width: 34px; height: 34px; flex: none; color: #7e231a; }
    .group span { flex: 1; }
    .group svg.chev { width: 22px; height: 22px; flex: none; }
    .group.on { background: linear-gradient(#2f8c3a,#1c5e22); color: #fff; border-color: #fbf0df; }
    .group.on svg.g { color: #fff; }
    #city-btn { padding: 8px 10px; gap: 8px; font-size: 17px; border-radius: 22px; border: 3px solid #c5532b; box-shadow: 0 0 0 2px #f0d9bd, 0 3px 8px rgba(0,0,0,.4); color: #7e231a; min-height: 64px; }
    #city-btn .ico { width: 32px; height: 32px; }
    #city-btn .chev { width: 20px; height: 20px; }
    .top-row { flex-wrap: wrap; }
    
    /* closer to the mock: three buttons in one row, photo header and photo buttons */
    .top-row { flex-wrap: nowrap; gap: 8px; }
    .top-row > .select-wrap { flex: 1; min-width: 0; }
    .top-row > .btn-map { flex: 1.15 1 0; min-height: 0; }
    .btn-region, #city-btn { font-size: 14px; gap: 5px; padding: 6px 7px; min-height: 58px; border-radius: 18px; }
    .btn-region .ico, #city-btn .ico, .btn-map .ico { width: 26px; height: 26px; }
    .btn-region .chev, #city-btn .chev, .btn-map .chev { width: 16px; height: 16px; }
    .btn-map { font-size: 15px; gap: 5px; padding: 6px 7px; border-radius: 18px; min-height: 58px; }
    .btn-map small { font-size: 10px; }
    #region-list { right: 0; }

    .thumb { width: 104px; height: 66px; }
    .name { font-size: 18px; }
    .top-row { gap: 6px; }
    .top-row > .btn-map { flex: 1 1 0; }
    .btn-region, #city-btn { font-size: 13px; gap: 3px; padding: 5px 5px; }
    .btn-region .ico, #city-btn .ico, .btn-map .ico { width: 22px; height: 22px; }
    .btn-region .chev, #city-btn .chev, .btn-map .chev { width: 14px; height: 14px; }
    .btn-region .label, #city-btn .label { min-width: 0; }
    .btn-map { font-size: 13px; gap: 3px; padding: 5px 5px; }
    .btn-map small { font-size: 9px; }
    .group { padding: 10px 8px; gap: 6px; }
    .group span { font-size: 18px; }
    .group svg.g { width: 30px; height: 30px; }
    .thumb { width: 88px; height: 58px; }
    .name { font-size: 17px; }
    /* dropdown lists: full width under the whole button row */
    .top-row { position: relative; }
    .top-row .select-wrap { position: static; }
    .dd-list, #region-list { left: 0; right: 0; top: calc(100% + 6px); }
    /* region / city buttons: icon on top, full name below */
    .btn-region, #city-btn { flex-direction: column; justify-content: center; gap: 2px; text-align: center; position: relative; padding: 6px 18px 6px 6px; }
    .btn-region .label, #city-btn .label { flex: none; white-space: normal; overflow: visible; text-overflow: clip; text-align: center; line-height: 1.1; }
    .btn-region .chev, #city-btn .chev { position: absolute; right: 4px; top: 50%; margin-top: -7px; }
    .msg { padding: 22px 16px; text-align: center; font-size: 16px; font-weight: 600; color: #3a2a26; }
    /* ===== three-screen layout (Stores home / category / directory) ===== */
    .screen { display: none; }
    .screen.show { display: block; }
    .group-row { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .group { flex-direction: column; justify-content: center; text-align: center; min-height: 112px; padding: 10px 4px; gap: 6px; }
    .group span { flex: none; font-size: 15px; line-height: 1.1; }
    .group svg.g { width: 34px; height: 34px; }
    .group svg.chev { display: none; }
    .group small { position: relative; z-index: 1; font-size: 10px; font-weight: 700; color: #7e231a; }
    #g-auto { background: linear-gradient(#fdf4e4, #ecd9b8); }
    #g-auto.soon { opacity: .6; }
    .pick-city { display: none; margin: 10px 4px 0; text-align: center; color: #fbf0df; font-weight: 700; font-size: 15px; }
    .pick-city.show { display: block; }
    .count-bar { display: flex; align-items: center; gap: 12px; margin-top: 14px; padding: 10px 12px; border-radius: 18px; border: 3px solid var(--cream);
      background: linear-gradient(#8f2a1f, #741f17); color: #fff; cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.35); width: 100%; font-family: inherit; text-align: left; }
    .count-bar svg { width: 32px; height: 32px; flex: none; }
    .count-bar h2 { flex: 1; margin: 0; font-size: 19px; font-weight: 800; }

    .back { display: inline-flex; align-items: center; gap: 6px; margin: 4px 0 10px; padding: 8px 14px; border-radius: 20px; border: 2px solid var(--cream);
      background: var(--cream); color: #1d1d1d; font: 800 15px "Montserrat", system-ui, sans-serif; cursor: pointer; }
    .back svg { width: 18px; height: 18px; transform: rotate(180deg); }
    .cat-head { display: flex; align-items: center; gap: 12px; margin: 0 -12px; padding: 16px; min-height: 120px; color: #fbf0df; background: #0e2f20 center/cover no-repeat; }
    .cat-head svg { width: 60px; height: 60px; flex: none; }
    .cat-head b { display: block; font-size: 30px; font-weight: 800; line-height: 1.05; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
    .cat-head i { display: block; font-style: normal; font-size: 13px; font-weight: 600; margin-top: 6px; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
    .big-card { display: flex; align-items: center; gap: 14px; margin-top: 14px; padding: 16px 14px; border-radius: 22px; background: var(--cream);
      border: 3px solid #eadcc2; box-shadow: 0 3px 8px rgba(0,0,0,.4); text-decoration: none; color: #1d1d1d; cursor: pointer; width: 100%; font-family: inherit; text-align: left; }
    .big-card .circle { width: 64px; height: 64px; flex: none; border-radius: 50%; background: #7e231a; color: #fff; display: flex; align-items: center; justify-content: center; }
    .big-card .circle svg { width: 34px; height: 34px; }
    .big-card b { display: block; font-size: 24px; font-weight: 800; }
    .big-card span.t { flex: 1; font-size: 14px; font-weight: 500; line-height: 1.3; }
    .big-card > svg { width: 26px; height: 26px; flex: none; }
    .big-card.off { opacity: .55; cursor: default; }
    .dir-top { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
    .dir-top .back { margin: 4px 0; }
    .map-view { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 20px; background: var(--cream); color: #1d1d1d;
      font: 800 14px "Montserrat", system-ui, sans-serif; text-decoration: none; }
    .map-view svg { width: 18px; height: 18px; color: #7e231a; }
    .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
    .tags span { background: #ecd9b8; color: #3a2a26; border-radius: 10px; padding: 2px 9px; font-size: 12px; font-weight: 700; }

    /* ===== look of the Nov 2026 mockup: cream panel, leather bars, photo tiles ===== */
    :root { --leather: #6b2a18; --leather2: #4e1d10; --panel: #f6ecda; --ink2: #2a1a12; }
    body { background: #123d29; padding: 10px; }
    .screen.show { background: var(--panel); border-radius: 26px; padding: 0 10px 14px; overflow: hidden; box-shadow: 0 4px 18px rgba(0,0,0,.45); }
    .brand { margin: 0 -10px; min-height: 120px; padding: 16px 18px 22px; gap: 14px; position: relative;
      background: linear-gradient(90deg, var(--leather2) 0%, var(--leather) 42%, rgba(107,42,24,.55) 62%, rgba(107,42,24,0) 82%),
                  url('hdr-tools.jpg') right center / auto 100% no-repeat, var(--leather); }
    .brand svg { width: 60px; height: 60px; }
    .brand b { font-size: 42px; }
    .brand i { font: italic 600 17px Georgia, "Times New Roman", serif; margin-top: 6px; }
    .brand::after { content: ""; position: absolute; left: 70px; bottom: 14px; width: 46%; height: 4px; border-radius: 4px;
      background: linear-gradient(90deg, rgba(124,179,66,0), #7cb342 30%, #7cb342 70%, rgba(124,179,66,0)); transform: rotate(-2deg); }
    .top-row { margin-top: 14px; }
    .btn-region, #city-btn { background: linear-gradient(#fffaf0, #f3e4c9); color: var(--ink2); border: 2px solid #8a4a2b; box-shadow: 0 2px 5px rgba(0,0,0,.25); }
    .btn-region .ico, #city-btn .ico { color: var(--leather); }
    .btn-map { background: linear-gradient(#2f7d34, #1c5a22); border: 2px solid #1c5a22; }

    .group-row { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
    .tile { display: flex; flex-direction: column; padding: 0; border-radius: 16px; overflow: hidden; cursor: pointer; text-align: left;
      background: linear-gradient(#fffaf0, #f1e2c6); border: 2px solid #e6d4b4; box-shadow: 0 3px 7px rgba(0,0,0,.25); font-family: inherit; }
    .tile .ph { height: 74px; background: #d8cdb9 center / cover no-repeat; }
    .tile .lbl { display: flex; align-items: center; gap: 5px; padding: 7px 5px 8px; color: var(--ink2); }
    .tile .lbl svg.g { width: 24px; height: 24px; flex: none; color: var(--leather); }
    .tile .lbl span { flex: 1; min-width: 0; font-size: 13.5px; font-weight: 800; line-height: 1.08; }
    .tile .lbl svg.chev { width: 14px; height: 14px; flex: none; }
    .tile small { display: block; font-size: 10px; font-weight: 700; color: #7e231a; }
    .tile.soon .ph { filter: grayscale(.6); opacity: .75; }
    .pick-city { color: #7e231a; }

    .count-bar { margin-top: 16px; padding: 10px 12px; border-radius: 18px; border: 2px dashed rgba(251,240,223,.75); outline: 3px solid var(--leather);
      background: linear-gradient(#7a3220, var(--leather2)); box-shadow: 0 3px 8px rgba(0,0,0,.35); }
    .count-bar h2 { font-size: 24px; }
    .count-bar .count { display: inline-flex; align-items: center; gap: 4px; background: #fff7e8; color: var(--ink2); border-radius: 16px; padding: 6px 12px; font-weight: 800; }
    .count-bar .count svg { width: 14px; height: 14px; transition: transform .15s; }
    .count-bar.closed .count svg { transform: rotate(-90deg); }

    .home-list { margin-top: 10px; }
    .home-list .rest, #rows .rest { border: 2px solid #eadbc0; border-radius: 16px; margin: 8px 0; background: #fffaf0; box-shadow: 0 2px 5px rgba(0,0,0,.18); }
    .home-list .rest.open, #rows .rest.open { border-color: #2e7d32; }
    .rest-head { padding: 7px 10px 7px 7px; }
    .thumb { width: 110px; height: 66px; border-radius: 10px; }
    .name { color: var(--ink2); font-size: 18px; }
    .where svg { color: var(--ink2); }
    .rest-head .chev { color: var(--ink2); }
    .results { background: transparent; border: 0; box-shadow: none; }
    .results-head { border-radius: 18px; background: linear-gradient(#7a3220, var(--leather2)); }
    .back, .map-view { background: #fffaf0; border-color: #e6d4b4; }
    .cat-head { margin: 0 -10px; }
  </style>
</head>

    <symbol id="i-store" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"><path d="M6 18 9 7h30l3 11c0 3-2.500 5-5.500 5S30 21 30 18c0 3-2.500 5-6 5s-6-2-6-5c0 3-2.500 5-6.500 5S6 21 6 18z"/><path d="M9 23v18h30V23M20 41V30h8v11"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 9-8 9 8M5 10v11h14V10M10 21v-6h4v6"/></symbol>
    <symbol id="i-hat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17h18M5 17a7 7 0 0 1 14 0M12 6v5M9 10V7.500M15 10V7.500M2 20h20"/></symbol>
    <symbol id="i-nav" viewBox="0 0 24 24" fill="currentColor"><path d="M21 3 3 10.500l7 2.500 2.500 7z"/></symbol>
    <symbol id="i-fork" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 3v7a2 2 0 0 0 2 2v9M9 3v7a2 2 0 0 1-2 2M7 3v6M17 21V3c-2.200 1.500-3 4.500-3 8h3"/>
    </symbol>
    <symbol id="i-pin" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.500A2.500 2.500 0 1 1 12 6.500a2.500 2.500 0 0 1 0 5z"/></symbol>
    <symbol id="i-chev-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 9 7 7 7-7"/></symbol>
    <symbol id="i-chev-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 15 7-7 7 7"/></symbol>
    <symbol id="i-chev-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.500 5 5L19.500 7"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5" y="3" width="14" height="18" rx="2"/><path d="M3 7h3M3 12h3M3 17h3M9 8h6M9 12h6M9 16h4"/>
    </symbol>
    <symbol id="i-phone" viewBox="0 0 24 24" fill="currentColor"><path d="M6.600 10.800a15.100 15.100 0 0 0 6.600 6.600l2.200-2.200a1 1 0 0 1 1-.25 11.400 11.400 0 0 0 3.600.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.500a1 1 0 0 1 1 1c0 1.250.2 2.450.57 3.600a1 1 0 0 1-.25 1z"/></symbol>
    <symbol id="i-bag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>
    </symbol>
    <symbol id="i-truck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 5h7v10H9z M16 9h3l3 3v3h-6"/><circle cx="8" cy="17" r="2"/><circle cx="18" cy="17" r="2"/><path d="M2 8h4M3 11h3M4 14h2"/>
    </symbol>    <symbol id="i-gift" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11h16v10H4zM3 7h18v4H3zM12 7v14M12 7S9 2 7 4s1 3 5 3zm0 0s3-5 5-3-1 3-5 3"/></symbol>
    <symbol id="i-hammer" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 9-8 9 8M5 10v11h14V10"/><path d="m9 18 5-5M13 11l2-2 2 2-2 2"/></symbol>
    <symbol id="i-tractor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="16" r="4"/><circle cx="18" cy="17" r="3"/><path d="M5 12V6h6l2 6h6v5M11 6v6M15 17h-4"/></symbol>
    <symbol id="i-cart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.500 11h10L20 8H6.500"/><circle cx="9" cy="19" r="1.500"/><circle cx="17" cy="19" r="1.500"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/><circle cx="12" cy="12" r="7"/></symbol>
    <symbol id="i-bag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 13H6L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></symbol>
  </svg>

  <!-- ================= SCREEN 1: Stores home ================= -->
  <div class="screen show" id="scr-home">
    <div class="brand" id="brand"><svg><use href="#i-store"/></svg><div><b>Stores</b><i>Business &amp; Home Goods</i></div></div>

    <div class="top-row" id="top-row">
      <div class="select-wrap" id="region-wrap" style="display:none">
        <button class="btn-region" id="region-btn" aria-haspopup="listbox" aria-expanded="false">
          <svg class="ico"><use href="#i-mapin"/></svg><span class="label" id="region-label">Select Region</span><svg class="chev"><use href="#i-chev-down"/></svg>
        </button>
        <ul class="dd-list" id="region-list" role="listbox"></ul>
      </div>
      <div class="select-wrap">
        <button class="btn-region" id="city-btn" aria-haspopup="listbox" aria-expanded="false">
          <svg class="ico"><use href="#i-building"/></svg><span class="label" id="city-label">Select City</span><svg class="chev"><use href="#i-chev-down"/></svg>
        </button>
        <ul class="dd-list" id="city-list" role="listbox"></ul>
      </div>
      <a class="btn-map" id="map-btn" target="_top" style="display:none"><svg class="ico"><use href="#i-mapin"/></svg><span>Open Map<small>(Store Locations)</small></span><svg class="chev"><use href="#i-chev-right"/></svg></a>
    </div>

    <div class="group-row" id="tiles"></div>
    <div class="pick-city" id="pick-city">Select a city first</div>

    <button class="count-bar" id="count-bar">
      <svg><use href="#i-store"/></svg><h2 id="count-title">All Stores</h2><span class="count"><span id="count-num"></span><svg><use href="#i-chev-down"/></svg></span>
    </button>
    <div class="home-list" id="home-rows"></div>
  </div>

  <!-- ================= SCREEN 2: category ================= -->
  <div class="screen" id="scr-cat">
    <button class="back" data-go="home"><svg><use href="#i-chev-right"/></svg>Back to Stores</button>
    <div class="cat-head" id="cat-head"><svg id="cat-icon"><use href="#i-store"/></svg><div><b id="cat-title"></b><i id="cat-sub"></i></div></div>

    <a class="big-card" id="card-products" target="_top">
      <div class="circle"><svg><use href="#i-cart"/></svg></div>
      <span class="t"><b>All Products</b><span id="products-text"></span></span>
      <svg><use href="#i-chev-right"/></svg>
    </a>
    <button class="big-card" id="card-directory">
      <div class="circle"><svg><use href="#i-store"/></svg></div>
      <span class="t"><b>Stores Directory</b>View the list of stores in this category with contact info, hours and directions.</span>
      <svg><use href="#i-chev-right"/></svg>
    </button>
  </div>

  <!-- ================= SCREEN 3: stores directory ================= -->
  <div class="screen" id="scr-dir">
    <div class="dir-top">
      <button class="back" id="dir-back"><svg><use href="#i-chev-right"/></svg>Back</button>
      <a class="map-view" id="map-view" target="_top"><svg><use href="#i-pin"/></svg>Map View</a>
    </div>
    <div class="results">
      <div class="results-head">
        <svg><use href="#i-store"/></svg>
        <h2 id="results-title">Stores Directory</h2>
        <span class="count" id="results-count"></span>
      </div>
      <div id="rows"><div class="msg">Loading stores…</div></div>
    </div>
  </div>

  <script>
    // ---- SETTINGS ----
    // Full address on purpose: it works wherever Wix shows this page (embedded site, WebView or preview).
    const API_ENDPOINT = "https://storemap-2g9i.onrender.com/api/stores";
    const MAP_URL = "https://storemap-2g9i.onrender.com/";
    const DEFAULT_STATE = "TX"; // shown after the city (e.g. "Midland, TX") unless the address already has a state
    const ITEMS_PATH = "/all-products"; // the All Products page on each Wix site

    // The three category tiles. "name" must match the store's category in the CMS.
    // "site" is the Wix site whose All Products page lists that category's items ("" = coming soon).
    // "key" is passed to the Wix page as ?cat= (matches CATEGORY_INFO in storeHelpers.js).
    const CATS = [
      { key: "shopping", name: "Shopping & Gifts", sub: "Clothing • Gifts • Footwear • Western Wear", icon: "i-bag",
        site: "https://www.lokaalhome1.com", image: "bg-home.jpg", tile: "tile-shopping.jpg", tileId: "g-shopping" },
      { key: "home", name: "Home & Hardware", sub: "Home Goods • Hardware • Building Supplies • Tools", icon: "i-hammer",
        site: "https://www.lokaalhub.com", image: "bg-biz.jpg", tile: "tile-home.jpg", tileId: "g-home" },
      { key: "auto", name: "Auto & Equipment", sub: "Parts • Tires • Equipment • Farm & Ranch", icon: "i-gear",
        site: "", image: "", tile: "tile-auto.jpg", tileId: "g-auto" },
    ];

    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const norm = (s) => String(s || "").toLowerCase().replace(/\s+/g, " ").trim();
    const cleanCity = (c) => String(c || "").replace(/[,\s]+(tx|texas)\.?$/i, "").trim();
    const icon = (id, cls) => '<svg' + (cls ? ' class="' + cls + '"' : "") + '><use href="#' + id + '"/></svg>';
    const $ = (id) => document.getElementById(id);
    const catNorm = (c) => norm(c).replace(/\band\b/g, "&");

    let all = [];
    let region = "", city = "", openId = null;
    let cat = null;              // the chosen CATS entry
    let dirCat = null;           // category shown in the directory (null = all stores)
    let regionLabels = new Map(), cityLabels = new Map();

    $("map-btn").href = MAP_URL; $("map-btn").style.display = "flex";
    $("map-view").href = MAP_URL;

    const stateOf = (r) => {
      const m = String(r.address || "").match(/\b([A-Za-z]{2})\b\s*\d{5}(?:-\d{4})?\s*$/) || String(r.address || "").match(/,\s*([A-Za-z]{2})\s*$/);
      return m ? m[1].toUpperCase() : DEFAULT_STATE;
    };
    const inRegion = (r) => !region || norm(r.region) === region;
    const inCity = (r) => !city || norm(r.city) === city;
    const inCat = (r, c) => !c || catNorm(c.name) === catNorm(r.category);
    const cityName = () => (city ? cityLabels.get(city) : "");

    // ---- screens (phone Back button works too) ----
    function show(name, push) {
      ["home", "cat", "dir"].forEach((s) => $("scr-" + s).classList.toggle("show", s === name));
      window.scrollTo(0, 0);
      if (push) history.pushState({ screen: name, cat: cat && cat.key, dirCat: dirCat && dirCat.key }, "");
    }
    window.addEventListener("popstate", (e) => {
      const st = e.state || { screen: "home" };
      cat = CATS.find((c) => c.key === st.cat) || cat;
      dirCat = CATS.find((c) => c.key === st.dirCat) || null;
      if (st.screen === "cat" && cat) fillCategory();
      if (st.screen === "dir") renderDirectory();
      show(st.screen || "home", false);
    });

    // ---- dropdown helpers ----
    function closeLists() {
      document.querySelectorAll(".dd-list").forEach((l) => l.classList.remove("open"));
      ["city-btn", "region-btn"].forEach((id) => $(id).setAttribute("aria-expanded", "false"));
    }
    function toggleList(btnId, listId) {
      const list = $(listId), willOpen = !list.classList.contains("open");
      closeLists();
      list.classList.toggle("open", willOpen);
      $(btnId).setAttribute("aria-expanded", willOpen);
    }
    const listHtml = (items, selKey) => items.map((it) =>
      '<li role="option" data-key="' + esc(it.key) + '"' + (it.key === selKey ? ' class="sel"' : "") + ">" +
      (it.key === selKey ? icon("i-check") : icon(it.icon || "i-building")) + "<span>" + esc(it.text) + "</span></li>").join("");

    function buildRegionList() {
      regionLabels = new Map();
      for (const r of all) if (r.region && !regionLabels.has(norm(r.region))) regionLabels.set(norm(r.region), r.region);
      $("region-wrap").style.display = regionLabels.size ? "block" : "none";
      const items = [{ key: "", text: "All Regions", icon: "i-mapin" }].concat([...regionLabels.entries()].sort((a, b) => a[1].localeCompare(b[1])).map(([k, t]) => ({ key: k, text: t, icon: "i-mapin" })));
      $("region-list").innerHTML = listHtml(items, region);
      $("region-label").textContent = region ? regionLabels.get(region) || "Select Region" : "Select Region";
    }
    function buildCityList() {
      cityLabels = new Map();
      for (const r of all.filter(inRegion)) if (r.city && !cityLabels.has(norm(r.city))) cityLabels.set(norm(r.city), r.city);
      const items = [{ key: "", text: "All Cities" }].concat([...cityLabels.entries()].sort((a, b) => a[1].localeCompare(b[1])).map(([k, t]) => ({ key: k, text: t })));
      $("city-list").innerHTML = listHtml(items, city);
      $("city-label").textContent = city ? cityName() || "Select City" : "Select City";
    }

    // ---- screen 1: tiles + count bar ----
    function buildTiles() {
      $("tiles").innerHTML = CATS.map((c) =>
        '<button class="tile' + (c.site ? "" : " soon") + '" data-cat="' + c.key + '">' +
        '<div class="ph" style="background-image:url(\'' + c.tile + '\')"></div>' +
        '<div class="lbl">' + icon(c.icon, "g") + "<span>" + esc(c.name) + (c.site ? "" : "<small>Coming soon</small>") + "</span>" +
        icon("i-chev-right", "chev") + "</div></button>").join("");
    }
    function renderHome() {
      const n = all.filter((r) => inRegion(r) && inCity(r)).length;
      $("count-title").textContent = city ? "Stores in " + cityName() : region ? "Stores in " + (regionLabels.get(region) || "region") : "All Stores";
      $("count-num").textContent = n + (n === 1 ? " Store" : " Stores");
      const shown = all.filter((r) => inRegion(r) && inCity(r)).sort((a, b) => String(a.name).localeCompare(String(b.name)));
      $("home-rows").innerHTML = shown.length ? shown.map(rowHtml).join("") : '<div class="msg">No stores here yet.</div>';
    }

    // ---- screen 2: category ----
    function productsUrl(c) {
      const q = new URLSearchParams({ cat: c.key });
      if (city) q.set("city", cityName());
      if (region) q.set("region", regionLabels.get(region) || "");
      return c.site + ITEMS_PATH + "?" + q.toString();
    }
    function fillCategory() {
      $("cat-title").textContent = cat.name;
      $("cat-sub").textContent = cat.sub;
      $("cat-icon").innerHTML = '<use href="#' + cat.icon + '"/>';
      $("cat-head").style.backgroundImage = cat.image
        ? "linear-gradient(90deg, rgba(14,47,32,.92) 0%, rgba(14,47,32,.55) 60%, rgba(14,47,32,.15) 100%), url('" + cat.image + "')" : "";
      const card = $("card-products");
      if (cat.site) {
        card.href = productsUrl(cat); card.classList.remove("off");
        $("products-text").textContent = "Browse all " + cat.name.toLowerCase() + " products from all stores" + (city ? " in " + cityName() : "") + ".";
      } else {
        card.removeAttribute("href"); card.classList.add("off");
        $("products-text").textContent = "Coming soon.";
      }
    }
    function openCategory(key) {
      cat = CATS.find((c) => c.key === key);
      if (!cat) return;
      fillCategory();
      show("cat", true);
    }

    // ---- screen 3: directory ----
    function actionsHtml(r) {
      const btn = (cls, ic, label, href) => href
        ? '<a class="act ' + cls + '" href="' + esc(href) + '"' + (href.indexOf("tel:") === 0 ? "" : ' target="_top"') + ">" + icon(ic) + "<span>" + label + "</span></a>"
        : '<span class="act ' + cls + ' off">' + icon(ic) + "<span>" + label + "</span></span>";
      const dir = isFinite(r.lat) && isFinite(r.lng) ? "https://www.google.com/maps/dir/?api=1&destination=" + r.lat + "," + r.lng : "";
      return '<div class="acts">' +
        btn("info", "i-store", "Store Info", r.storeUrl || r.websiteUrl) +
        btn("call", "i-phone", "Call", r.phone ? "tel:" + r.phone : "") +
        btn("dir", "i-nav", "Directions", dir) + "</div>";
    }
    function rowHtml(r) {
      const open = String(r.id) === openId;
      const photo = (r.photos || [])[0];
      const thumb = '<div class="thumb">' + (photo ? '<img src="' + esc(photo) + '" alt="" loading="lazy" onerror="this.remove()">' : "🏬") + "</div>";
      const place = r.city ? esc(cityLabels.get(norm(r.city)) || r.city) + ", " + esc(stateOf(r)) : esc(r.address || "");
      const tags = (r.tags || []).length ? '<div class="tags">' + r.tags.map((t) => "<span>" + esc(t) + "</span>").join("") + "</div>" : "";
      return '<div class="rest' + (open ? " open" : "") + '">' +
        '<div class="rest-head" data-id="' + esc(r.id) + '">' + thumb +
        '<div class="info"><div class="name">' + esc(r.name) + "</div>" + (place ? '<div class="where">' + icon("i-pin") + "<span>" + place + "</span></div>" : "") + tags + "</div>" +
        icon(open ? "i-chev-up" : "i-chev-right", "chev") + "</div>" + (open ? actionsHtml(r) : "") + "</div>";
    }
    function renderDirectory() {
      const shown = all.filter((r) => inRegion(r) && inCity(r) && inCat(r, dirCat))
        .sort((a, b) => String(a.name).localeCompare(String(b.name)));
      $("results-title").textContent = (dirCat ? dirCat.name : "All Stores") + (city ? " · " + cityName() : "");
      $("results-count").textContent = shown.length + (shown.length === 1 ? " Store" : " Stores");
      $("rows").innerHTML = shown.length ? shown.map(rowHtml).join("") : '<div class="msg">No stores here yet.</div>';
    }
    function openDirectory(c) {
      dirCat = c; openId = null;
      renderDirectory();
      show("dir", true);
    }

    function refreshAll() { buildRegionList(); buildCityList(); renderHome(); }

    // ---- events ----
    $("city-btn").addEventListener("click", (e) => { e.stopPropagation(); toggleList("city-btn", "city-list"); });
    $("region-btn").addEventListener("click", (e) => { e.stopPropagation(); toggleList("region-btn", "region-list"); });
    $("city-list").addEventListener("click", (e) => {
      const li = e.target.closest("li"); if (!li) return;
      city = li.dataset.key; closeLists(); $("pick-city").classList.remove("show");
      refreshAll(); save();
    });
    $("region-list").addEventListener("click", (e) => {
      const li = e.target.closest("li"); if (!li) return;
      region = li.dataset.key; city = ""; closeLists();
      refreshAll(); save();
    });
    $("tiles").addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      if (!city && cityLabels.size > 1) { $("pick-city").classList.add("show"); return; }
      openCategory(b.dataset.cat);
    });
    // "All Stores" bar opens/closes the list under it
    // All Products: open the Wix page once, ignore extra taps, and show that it's working
    let opening = false;
    $("card-products").addEventListener("click", (e) => {
      const url = $("card-products").getAttribute("href");
      e.preventDefault();
      if (!url || opening) return;
      opening = true;
      $("products-text").textContent = "Opening products…";
      $("card-products").classList.add("off");
      // The app sometimes swallows the first jump to another website, so if we're still here
      // after a moment, try again by itself (the "second tap" you were doing by hand).
      const goNow = () => { try { window.location.assign(url); } catch (err) { window.location.href = url; } };
      setTimeout(goNow, 100);
      setTimeout(() => { if (document.visibilityState === "visible") goNow(); }, 1500);
      setTimeout(() => { if (document.visibilityState === "visible") goNow(); }, 3500);
      // if the app blocked it, let them try again after a few seconds
      setTimeout(() => { opening = false; $("card-products").classList.remove("off"); fillCategory(); }, 6000);
    });

    $("count-bar").addEventListener("click", () => {
      const closed = $("count-bar").classList.toggle("closed");
      $("home-rows").style.display = closed ? "none" : "";
    });
    $("home-rows").addEventListener("click", (e) => {
      const head = e.target.closest(".rest-head"); if (!head) return;
      openId = openId === head.dataset.id ? null : head.dataset.id; renderHome();
    });
    $("card-directory").addEventListener("click", () => openDirectory(cat));
    $("dir-back").addEventListener("click", () => history.back());
    document.querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => history.back()));
    $("rows").addEventListener("click", (e) => {
      const head = e.target.closest(".rest-head"); if (!head) return;
      openId = openId === head.dataset.id ? null : head.dataset.id; renderDirectory();
    });
    document.addEventListener("click", closeLists);

    // ---- remember region/city; accept ?region=&city=&cat=&view= from the Wix "Back" button ----
    function save() { try { localStorage.setItem("storesPick", JSON.stringify({ region, city })); } catch (e) {} }
    function restore() {
      const q = new URLSearchParams(location.search);
      let saved = {};
      try { saved = JSON.parse(localStorage.getItem("storesPick") || "{}"); } catch (e) {}
      region = q.has("region") ? norm(q.get("region")) : saved.region || "";
      city = q.has("city") ? norm(cleanCity(q.get("city"))) : saved.city || "";
      if (region && !all.some((r) => norm(r.region) === region)) region = "";
      if (city && !all.some((r) => inRegion(r) && norm(r.city) === city)) city = "";
      refreshAll();
      history.replaceState({ screen: "home" }, "");
      const c = CATS.find((x) => x.key === q.get("cat"));
      if (c && q.get("view") === "category") openCategory(c.key);
    }

    buildTiles();

    // The free Render server can be asleep for up to a minute, so retry a few times.
    async function load(attempt = 1) {
      $("count-title").textContent = attempt === 1 ? "Loading stores…" : "Waking up the server… (try " + attempt + ")";
      try {
        const res = await fetch(API_ENDPOINT, { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const json = await res.json();
        if (!json || !Array.isArray(json.stores)) throw new Error("Bad response");
        // "Seminole Tx" or "Seminole, TX" in the CMS is shown as just "Seminole"
        all = json.stores.map((r) => ({ ...r, city: r.city ? cleanCity(r.city) : r.city }));
        restore();
      } catch (err) {
        console.error(err);
        if (attempt < 12) setTimeout(() => load(attempt + 1), 5000);
        else $("count-title").textContent = "Couldn't load stores. Please reload.";
      }
    }
    load();
  </script>
</body>
</html>
