<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Properties for Sale or Rent — Lokaal</title>
<style>
  :root{--green:#173f1e;--g2:#1f5a2a;--maroon:#7a2318;--maroon2:#8f2d1f;--gold:#a06a12;--cream:#f7efdf;--cream2:#efe3c8;--tan:#d9b98a;--ink:#1d1a17;--muted:#6b6258}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);
       background:radial-gradient(120% 60% at 20% 0%,#2a6a33 0%,var(--green) 55%,#10301a 100%);min-height:100vh;overflow-x:hidden;touch-action:pan-y}
  .wrap{padding:12px 12px 28px;max-width:640px;margin:0 auto}
  button{font:inherit;cursor:pointer}
  img{display:block;-webkit-user-drag:none}
  .hide{display:none!important}

  .banner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;border:3px solid var(--cream2);
          background:linear-gradient(var(--maroon2),var(--maroon));color:#fff;box-shadow:0 3px 10px #0006}
  .banner h1{margin:0;font-size:22px;line-height:1.1}.banner small{display:block;font-size:13px;opacity:.9;margin-top:3px}

  .area{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .pick{position:relative;display:flex;align-items:center;gap:8px;background:var(--cream);border:3px solid var(--tan);border-radius:16px;padding:8px 10px;box-shadow:0 2px 6px #0004;min-width:0}
  .pick svg{flex:0 0 auto;color:var(--maroon)}
  .pick .t{min-width:0;flex:1}
  .pick small{display:block;color:var(--maroon);font-size:12px}
  .pick b{display:block;color:var(--maroon);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pick select{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:16px}
  .mapbar{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:10px;background:var(--cream);border:3px solid var(--tan);
          border-radius:16px;padding:10px;color:var(--maroon);font-weight:800;font-size:19px;box-shadow:0 2px 6px #0004;position:relative}
  .mapbar .go{position:absolute;right:14px}

  .ad{position:relative;margin-top:12px;border-radius:20px;overflow:hidden;background:var(--cream);border:4px solid var(--cream2);box-shadow:0 3px 10px #0006;aspect-ratio:12/6.5;width:100%;padding:0;display:block;text-align:left}
  .ad img{width:100%;height:100%;object-fit:cover}
  .ad .ribbon{position:absolute;top:10px;left:0;background:linear-gradient(var(--maroon2),var(--maroon));color:#fff;font-weight:800;font-size:15px;padding:7px 22px 7px 14px;clip-path:polygon(0 0,100% 0,92% 100%,0 100%)}
  .ad .tag{position:absolute;top:10px;right:10px;background:#000a;color:#fff;font-size:11px;font-weight:800;padding:4px 8px;border-radius:6px}
  .ad .over{position:absolute;left:0;bottom:0;max-width:64%;padding:12px 14px 14px;background:linear-gradient(90deg,var(--cream) 72%,transparent);border-top-right-radius:14px}
  .ad .over b{display:block;font-size:20px;line-height:1.1}
  .ad .over .c{display:flex;align-items:center;gap:4px;margin-top:4px;font-size:14px}
  .ad .over .p{display:inline-block;margin-top:6px;background:var(--maroon);color:#fff;font-weight:800;font-size:18px;padding:4px 14px;border-radius:10px}
  .ad.empty{display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;background:linear-gradient(135deg,var(--cream),var(--cream2));aspect-ratio:12/4.5;text-decoration:none}
  .ad.empty b{color:var(--maroon);font-size:18px}.ad.empty span{display:block;color:var(--muted);font-size:13px;margin-top:6px}
  .dots{position:absolute;bottom:8px;right:12px;display:flex;gap:5px}.dots i{width:6px;height:6px;border-radius:50%;background:#fff8}.dots i.on{background:#fff}

  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--cream);border:4px solid var(--cream2);border-radius:18px;padding:10px 4px;
        box-shadow:0 2px 6px #0005;min-height:112px;color:var(--maroon);text-align:center}
  .tile b{font-size:14px;line-height:1.1}
  .tile.res{background:linear-gradient(#2f7a3b,#1f5a2a);color:#fff}
  .tile.on{border-color:#fff;box-shadow:0 0 0 3px var(--maroon),0 2px 8px #0007}

  .box{margin-top:14px;background:var(--cream);border-radius:20px;overflow:hidden;border:3px solid var(--cream2);box-shadow:0 3px 10px #0005}
  .box h2{margin:0;display:flex;align-items:center;gap:12px;color:#fff;font-size:20px;padding:12px 16px;background:linear-gradient(var(--maroon2),var(--maroon))}
  .box.res h2{background:linear-gradient(#2f7a3b,var(--g2))}
  .box.vac h2{background:linear-gradient(#b98322,var(--gold))}
  .box .x2{margin-left:auto;background:#fff3;border:0;color:#fff;border-radius:50%;width:30px;height:30px;font-size:18px}
  .filters{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;padding:12px 14px 14px}
  .f label{display:block;font-weight:800;font-size:14px;margin-bottom:6px}
  .f.wide{grid-column:1/-1}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:transparent;border:2px solid #9b8c76;color:var(--ink);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px}
  .chip.on{background:var(--g2);border-color:var(--g2);color:#fff}
  select.dd,input.dd{width:100%;padding:10px 12px;border-radius:12px;border:2px solid #9b8c76;background:#fffaf0;font-size:16px;color:var(--ink);-webkit-appearance:none;appearance:none}
  .btns{grid-column:1/-1;display:grid;grid-template-columns:2fr 1fr;gap:8px}
  .searchbtn,.mapbtn{border:0;border-radius:999px;padding:12px;font-weight:800;font-size:17px;color:#fff;background:linear-gradient(var(--maroon2),var(--maroon))}
  .mapbtn{background:#fff;color:var(--maroon);border:2px solid var(--maroon)}
  .boxad{padding:0 12px}.boxad .ad{aspect-ratio:12/5}
  .found{color:#f3e7cf;text-align:center;font-weight:800;margin:14px 0 4px;font-size:17px}

  .rrow,.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;color:inherit}
  .rrow{margin-top:10px;background:var(--cream);border:3px solid var(--cream2);border-radius:18px;padding:10px;box-shadow:0 2px 6px #0005}
  .row{padding:10px 12px;background:none;border:0;border-bottom:1px solid #e3d6bb}
  .row:last-child{border-bottom:0}
  .ph{position:relative;flex:0 0 40%;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:#ddd}
  .row .ph{flex:0 0 118px;height:84px;aspect-ratio:auto}
  .ph img{width:100%;height:100%;object-fit:cover}
  .badge{position:absolute;left:6px;bottom:6px;background:#000b;color:#fff;font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px}
  .feat{position:absolute;top:0;left:0;right:0;background:#3b3b3bcc;color:#fff;font-size:11px;font-weight:800;text-align:center;padding:3px}
  .t{flex:1;min-width:0}
  .t b{display:block;font-size:16px;line-height:1.2;color:#203a24;max-height:2.4em;overflow:hidden}
  .s2{color:#4a443d;font-size:13px;margin-top:2px}
  .c{display:flex;align-items:center;gap:4px;font-size:13px;margin-top:3px}
  .lp{display:inline-block;margin-top:4px;background:var(--g2);color:#fff;font-weight:800;font-size:12px;padding:2px 9px;border-radius:999px}
  .lp.rent{background:var(--gold)}
  .p{color:var(--maroon);font-weight:800;font-size:18px;margin-top:2px}
  .p small{font-size:12px;color:var(--muted)}
  .chev{flex:0 0 18px;color:var(--maroon)}
  .none{color:#f3e7cf;text-align:center;padding:16px}
  .panel{margin-top:14px;background:var(--cream);border-radius:20px;overflow:hidden;border:3px solid var(--cream2);box-shadow:0 3px 10px #0005}
  .panel h2{margin:0;display:flex;align-items:center;gap:12px;background:linear-gradient(var(--maroon2),var(--maroon));color:#fff;font-size:20px;padding:12px 16px}
  .addbtn{display:block;margin-top:14px;text-align:center;text-decoration:none;background:var(--cream);color:var(--maroon);border:3px solid var(--tan);border-radius:14px;padding:11px;font-weight:800}

  /* map — built from the property-map repo (Mapbox satellite, clusters, collapsible card strip) */
  .mapwrap{position:fixed;inset:0;z-index:40;background:#222;display:flex;flex-direction:column}
  .maptop{display:flex;align-items:center;gap:8px;padding:10px 12px;background:linear-gradient(var(--maroon2),var(--maroon));color:#fff}
  .maptop b{flex:1;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .maptop button{background:var(--cream);color:var(--maroon);border:0;border-radius:999px;padding:8px 12px;font-weight:800;font-size:14px;white-space:nowrap}
  .mapbody{position:relative;flex:1}
  #map{position:absolute;inset:0}
  #filter-panel{position:absolute;top:12px;left:12px;z-index:2;background:#fff;padding:10px 14px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.2);font-size:14px}
  #filter-panel label{display:flex;align-items:center;gap:6px;margin:4px 0}
  #filter-panel i{width:10px;height:10px;border-radius:50%;display:inline-block}
  .styleBtn{position:absolute;top:12px;right:12px;z-index:2;background:#fff;border:0;border-radius:8px;padding:8px 12px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.2)}
  #bottom-panel{position:absolute;bottom:0;left:0;right:0;z-index:2;transition:transform .28s ease}
  #bottom-panel.collapsed{transform:translateY(calc(100% - 30px))}
  #panel-handle{display:flex;justify-content:center;align-items:center;height:30px;touch-action:none}
  #panel-handle .bar{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.85);box-shadow:0 1px 3px #0008}
  #result-count{text-align:center;font-weight:600;font-size:15px;padding-bottom:4px;color:#fff;text-shadow:0 1px 3px #000}
  #card-strip{display:flex;gap:10px;overflow-x:auto;padding:0 12px 14px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
  .listing-card{flex:0 0 260px;scroll-snap-align:start;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.25);
    text-decoration:none;color:inherit;display:block;transition:transform .15s ease;border:0;padding:0;text-align:left;font:inherit}
  .listing-card.active{transform:translateY(-4px);box-shadow:0 4px 16px rgba(0,0,0,.35)}
  .card-photo{width:100%;height:130px;background:#e2e2e2;display:flex;align-items:center;justify-content:center}
  .card-photo img{width:100%;height:100%;object-fit:cover;display:block}
  .card-photo-fallback::before{content:"🏠";font-size:32px;opacity:.4}
  .listing-card .card-body{padding:8px 10px 10px}
  .card-top-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .listing-card .card-price{font-size:17px;font-weight:700}
  .card-status{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;padding:3px 8px;border-radius:10px;white-space:nowrap;flex-shrink:0;background:#e0e0e0;color:#333}
  .card-status.status-sale{background:#d7f0dd;color:#1e6b34}
  .card-status.status-rent{background:#dce8fb;color:#1a4c96}
  .card-status.status-pending{background:#fbe9cf;color:#93590a}
  .listing-card .card-meta{font-size:12px;color:#444;margin:2px 0}
  .listing-card .card-address{font-size:12px;color:#666;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* popup */
  .pop{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:60}
  .pop.open{display:flex}
  .sheet{background:var(--cream);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0}
  .gal{position:relative;background:#111}
  .gal .strip{display:flex;overflow-x:auto;scroll-snap-type:x mandatory}
  .gal img{flex:0 0 100%;width:100%;aspect-ratio:4/3;object-fit:contain;scroll-snap-align:center}
  .gal .cnt{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:#000a;color:#fff;font-size:12px;padding:3px 9px;border-radius:999px}
  .xb{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:0;background:#000a;color:#fff;font-size:20px}
  .info{padding:14px 16px 20px}
  .info h4{margin:0;font-size:22px;color:#203a24}
  .info .sub{color:var(--muted);margin-top:2px}
  .info .pp{color:var(--maroon);font-size:26px;font-weight:800;margin-top:6px}
  .facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .fact{background:#fff;border:2px solid #e3d6bb;border-radius:12px;padding:6px 10px;text-align:center;min-width:64px}
  .fact b{display:block;font-size:17px}.fact span{font-size:11px;color:var(--muted)}
  .specs{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:12px;font-size:15px}
  details{margin-top:12px;border:2px solid #d8ccb4;border-radius:12px;background:#fffaf0}
  summary{padding:10px 12px;font-weight:800}
  details .specs{padding:0 12px 12px;margin-top:0}
  .info p{white-space:pre-line;line-height:1.45;margin:12px 0 0}
  .acts{display:grid;grid-template-columns:1fr 1fr;margin-top:16px;border:2px solid #d8ccb4;border-radius:14px;overflow:hidden}
  .act{display:flex;align-items:center;justify-content:center;background:#fffaf0;color:var(--ink);text-decoration:none;border:0;border-right:1px solid #d8ccb4;border-bottom:1px solid #d8ccb4;padding:13px 8px;font-weight:800;font-size:15px}
  .act.main{background:var(--maroon);color:#fff}
  .act.wide{grid-column:1/-1}
  .seller{text-align:center;padding:12px;font-weight:800;background:#efe5cf;grid-column:1/-1}
  .loading{color:#fff;text-align:center;padding:40px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="banner">
    <svg viewBox="0 0 24 24" width="54" height="54" fill="none" stroke="#fff" stroke-width="2.2"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/><path d="M16 5V3h2v4"/></svg>
    <div><h1>Properties for Sale or Rent</h1><small>Homes • Commercial • Vacation &amp; Venues</small></div>
  </div>

  <div class="area">
    <label class="pick">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 13a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M12 21s6-5.6 6-11a6 6 0 1 0-12 0c0 5.4 6 11 6 11Z"/><path d="M4 17l-2 5h20l-2-5"/></svg>
      <span class="t"><small>Region</small><b id="regionLbl">All Regions</b></span>
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3"><path d="m6 9 6 6 6-6"/></svg>
      <select id="regionSel" aria-label="Region"></select>
    </label>
    <label class="pick">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 21h18M5 21V8l6-3v16M11 21V3l8 4v14"/></svg>
      <span class="t"><small>City</small><b id="cityLbl">All Cities</b></span>
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3"><path d="m6 9 6 6 6-6"/></svg>
      <select id="citySel" aria-label="City"></select>
    </label>
  </div>
  <button class="mapbar" id="mapBar">
    <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14M15 6v14"/></svg>
    <span id="mapBarText">View on Map</span><span class="go">›</span>
  </button>

  <div id="loading" class="loading">Loading properties…</div>
  <div id="main" class="hide">
    <div id="adMain"></div>
    <div class="tiles" id="tiles"></div>
    <div id="boxWrap"></div>
    <div id="results"></div>
  </div>
</div>

<div class="mapwrap hide" id="mapWrap">
  <div class="maptop"><b id="mapTitle">Map</b><button id="mapClose">‹ Back to List</button></div>
  <div class="mapbody">
    <div id="map"></div>
    <div id="filter-panel"></div>
    <button class="styleBtn" id="styleBtn">Map</button>
    <div id="bottom-panel">
      <div id="panel-handle"><div class="bar"></div></div>
      <div id="result-count"></div>
      <div id="card-strip"></div>
    </div>
  </div>
</div>
<div class="pop" id="pop"><div class="sheet" id="sheet"></div></div>

<script>
(function(){
  var API="/api/properties", AREA_KEY="lokaalArea";
  var D=null, sec="", region="", city="", timers=[], F={}, map=null, layer=null;
  function $(id){return document.getElementById(id);}
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function norm(s){return String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");}
  function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||"null");localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}}
  function uniq(a){var o=[];a.forEach(function(x){if(x&&o.indexOf(x)<0)o.push(x);});return o.sort();}
  function fmt(n){return Number(n).toLocaleString("en-US");}
  var PIN='<svg viewBox="0 0 24 24" width="15" height="15" fill="#1f6b2e"><path d="M12 2a7 7 0 0 0-7 7c0 5.3 7 13 7 13s7-7.7 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5Z"/></svg>';
  var CHEV='<svg class="chev" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="3"><path d="m9 6 6 6-6 6"/></svg>';
  var SLIDERS='<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#fff" stroke-width="2"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>';
  var ICON={
    res:'<svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>',
    com:'<svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l2-5h14l2 5"/><path d="M3 9h18v2a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0V9Z"/><path d="M5 13v8h14v-8M10 21v-5h4v5"/></svg>',
    vac:'<svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21V12l5-4 5 4v9M2 13l7-6 7 6M7 21v-4h4v4"/><path d="M19 21v-4M19 17l-3-4h2l-2-3h2l-2-3 3-4 3 4h-2l2 3h-2l2 3h-2"/></svg>'
  };
  function color(k){var s=D.sections.filter(function(x){return x.key===k;})[0];return (s&&s.color)||"#1f5a2a";}
  function short(it){
    var n=it.priceNum; if(!n) return it.price?it.price.replace("Call for Price","Call"):"•";
    var t=n>=1e6?(Math.round(n/1e5)/10)+"M":n>=1e3?Math.round(n/1e3)+"K":String(n);
    return "$"+t+(it.priceSuffix?"/nt":"");
  }
  function sizeLine(it){
    var a=[];
    if(it.beds) a.push(it.beds+" Bed");
    if(it.baths) a.push(it.baths+" Bath");
    if(it.sqft) a.push(fmt(it.sqft)+" SF");
    if(it.acres) a.push(fmt(it.acres)+" Acres");
    if(it.sleeps) a.push("Sleeps "+it.sleeps);
    return a.join(" • ");
  }
  function priceHtml(it){ return it.price?'<div class="p">'+esc(it.price)+(it.priceSuffix&&it.priceNum?' <small>'+esc(it.priceSuffix)+'</small>':'')+'</div>':''; }

  // ---------- area ----------
  function fillArea(){
    var rs=Object.keys(D.regions||{}); D.items.forEach(function(it){ if(it.region&&rs.indexOf(it.region)<0) rs.push(it.region); });
    $("regionSel").innerHTML='<option value="">All Regions</option>'+rs.map(function(r){return '<option'+(r===region?' selected':'')+'>'+esc(r)+'</option>';}).join("");
    var cs=uniq(D.items.filter(function(it){return !region||it.region===region;}).map(function(it){return it.city;}));
    if(city&&cs.indexOf(city)<0) city="";
    $("citySel").innerHTML='<option value="">All Cities</option>'+cs.map(function(c){return '<option'+(c===city?' selected':'')+'>'+esc(c)+'</option>';}).join("");
    $("regionLbl").textContent=region||"All Regions"; $("cityLbl").textContent=city||"All Cities";
  }
  $("regionSel").onchange=function(){region=this.value;city="";store(AREA_KEY,{region:region,city:city});fillArea();render();};
  $("citySel").onchange=function(){city=this.value;store(AREA_KEY,{region:region,city:city});fillArea();render();};
  // listings with no city yet show everywhere, so nothing disappears before City is filled in
  function inArea(it){ if(!it.city) return true; if(city) return norm(it.city)===norm(city); if(region) return it.region===region; return true; }

  // ---------- ads ----------
  function adBox(el, spot, ribbon){
    var list=D.ads.filter(function(a){return norm(a.spot)===norm(spot);});
    if(!list.length){
      var h=D.advertise.link;
      el.innerHTML='<'+(h?'a href="'+esc(h)+'" target="_blank"':'div')+' class="ad empty" style="margin-top:12px"><div><b>'+esc(D.advertise.text)+'</b><span>Your ad shows here for every buyer in the area</span></div></'+(h?'a':'div')+'>';
      return;
    }
    var i=0;
    el.innerHTML='<button class="ad"><img alt="Sponsored">'+(ribbon?'<span class="ribbon">'+esc(ribbon)+'</span>':'')+'<span class="tag">SPONSORED</span><div class="over hide"></div>'+(list.length>1?'<div class="dots">'+list.map(function(){return"<i></i>";}).join("")+'</div>':'')+'</button>';
    var b=el.firstChild,img=b.querySelector("img"),over=b.querySelector(".over"),dots=b.querySelectorAll(".dots i");
    function show(){var a=list[i];img.src=a.image;var has=a.title||a.price||a.city;over.classList.toggle("hide",!has);
      if(has) over.innerHTML=(a.title?'<b>'+esc(a.title)+'</b>':'')+(a.city?'<div class="c">'+PIN+esc(a.city)+'</div>':'')+(a.price?'<span class="p">'+esc(a.price)+'</span>':'');
      dots.forEach(function(d,k){d.className=k===i?"on":"";});}
    show(); b.onclick=function(){if(list[i].link) window.open(list[i].link,"_blank");};
    if(list.length>1) timers.push(setInterval(function(){i=(i+1)%list.length;show();},8000));
  }

  // ---------- rows ----------
  function rowHtml(it, cls){
    var s=D.sections.filter(function(x){return x.key===it.sec;})[0]||{};
    var lp=it.listing?'<span class="lp'+(/rent/i.test(it.listing)?' rent':'')+'">'+esc(it.listing)+'</span>':'';
    return '<button class="'+cls+'" data-id="'+esc(it.id)+'"><div class="ph">'+(it.image?'<img loading="lazy" src="'+esc(it.image)+'" alt="">':'')+
      (it.featured?'<span class="feat">Featured Listing</span>':'')+(cls==="row"?'<span class="badge">'+esc((s.label||"").replace(/ Properties$/,""))+'</span>':'')+'</div>'+
      '<div class="t"><b>'+esc(it.title)+'</b>'+'<div class="s2">'+esc(sizeLine(it)||it.type)+'</div>'+(it.city?'<div class="c">'+PIN+esc(it.city)+', TX</div>':'')+
      lp+priceHtml(it)+'</div>'+CHEV+'</button>';
  }

  // ---------- render ----------
  function render(){
    timers.forEach(clearInterval); timers=[];
    adBox($("adMain"),"Main Page","Featured Property");
    $("tiles").innerHTML=D.sections.map(function(s){
      return '<button class="tile '+esc(s.key)+(s.key===sec?' on':'')+'" data-sec="'+esc(s.key)+'">'+(ICON[s.key]||ICON.res)+'<b>'+esc(s.label).replace(" &amp; ","<br>&amp; ").replace(" Properties","<br>Properties")+'</b></button>';
    }).join("");
    $("mapBarText").textContent=sec?"View These on Map":"View on Map";
    if(!sec){ $("boxWrap").innerHTML=""; renderLatest(); return; }
    renderBox(); renderResults();
  }
  function renderLatest(){
    var list=D.items.filter(inArea).slice().sort(function(a,b){return (b.created||0)-(a.created||0);}).slice(0,5);
    $("results").innerHTML='<div class="panel"><h2>'+SLIDERS+'Latest Listings</h2>'+
      (list.length?list.map(function(it){return rowHtml(it,"row");}).join(""):'<div class="none" style="color:var(--muted)">No properties in this area yet.</div>')+'</div>';
  }
  function secItems(){ return D.items.filter(function(it){return it.sec===sec&&inArea(it);}); }

  function renderBox(){
    var s=D.sections.filter(function(x){return x.key===sec;})[0]; if(!s) return;
    var f=F[sec]||(F[sec]={listing:"All",type:"All",beds:"",baths:"",sleeps:"",acres:"",agent:"",q:""});
    var base=secItems();
    var listings=uniq(base.map(function(it){return it.listing;}));
    var types=uniq(base.map(function(it){return it.type;}));
    var agents=uniq(base.map(function(it){return it.seller;}));
    var has=function(k){return base.some(function(it){return it[k];});};
    var chip=function(k,v){return '<button class="chip'+(f[k]===v?' on':'')+'" data-f="'+k+'" data-v="'+esc(v)+'">'+esc(v)+'</button>';};
    var dd=function(k,label,ph,opts){return '<div class="f"><label>'+label+'</label><select class="dd" data-f="'+k+'"><option value="">'+ph+'</option>'+
      opts.map(function(o){var v=Array.isArray(o)?o[0]:o,t=Array.isArray(o)?o[1]:o;return '<option value="'+esc(v)+'"'+(String(f[k])===String(v)?' selected':'')+'>'+esc(t)+'</option>';}).join("")+'</select></div>';};
    var plus=function(nums,word){return nums.map(function(n){return [n,n+"+ "+word];});};
    var h='';
    if(listings.length>1) h+='<div class="f wide"><label>Status:</label><div class="chips">'+['All'].concat(listings).map(function(v){return chip("listing",v);}).join("")+'</div></div>';
    if(types.length>1) h+=(sec==="com"?'<div class="f wide"><label>Property Type:</label><div class="chips">'+['All'].concat(types).map(function(v){return chip("type",v);}).join("")+'</div></div>'
                                      :dd("type","Type:","Any Type",types));
    if(sec==="res"||sec==="vac"){ if(has("beds")) h+=dd("beds","Bedrooms:","Any",plus([1,2,3,4,5],"Beds")); if(has("baths")) h+=dd("baths","Baths:","Any",plus([1,2,3,4],"Baths")); }
    if(sec==="vac"&&has("sleeps")) h+=dd("sleeps","Sleeps / Guests:","Any",plus([2,4,6,8,10,12],"Guests"));
    if(sec==="com"&&has("acres")) h+=dd("acres","Acres:","Any Size",[[1,"1+ Acres"],[5,"5+ Acres"],[20,"20+ Acres"],[100,"100+ Acres"],[500,"500+ Acres"]]);
    if(agents.length) h+=dd("agent","Agent Name:","Any Agent",agents);
    h+='<div class="f wide"><input class="dd" id="q" type="search" placeholder="Search by name, type or address…" value="'+esc(f.q)+'"></div>';
    h+='<div class="btns"><button class="searchbtn" id="searchBtn">🔍 Search</button><button class="mapbtn" data-map="1">🗺 Map</button></div>';
    $("boxWrap").innerHTML='<div class="box '+esc(sec)+'" id="box"><h2>'+SLIDERS+esc(s.listTitle||s.label)+'<button class="x2" data-closebox aria-label="Close">×</button></h2>'+
      '<div class="boxad" id="adBox"></div><div class="filters">'+h+'</div></div>';
    adBox($("adBox"), s.adTitle);
    $("q").oninput=function(){f.q=this.value;renderResults();};
    $("searchBtn").onclick=function(){renderResults();$("results").scrollIntoView({behavior:"smooth"});};
    Array.prototype.forEach.call(document.querySelectorAll("select[data-f]"),function(sel){sel.onchange=function(){f[sel.getAttribute("data-f")]=sel.value;renderResults();};});
  }
  function filtered(){
    var f=F[sec], qq=norm(f.q);
    return secItems().filter(function(it){
      return (f.listing==="All"||it.listing===f.listing)&&(f.type==="All"||!f.type||it.type===f.type)&&
        (!f.beds||(it.beds||0)>=+f.beds)&&(!f.baths||(it.baths||0)>=+f.baths)&&(!f.sleeps||(it.sleeps||0)>=+f.sleeps)&&(!f.acres||(it.acres||0)>=+f.acres)&&
        (!f.agent||it.seller===f.agent)&&(!qq||norm(it.title+" "+it.type+" "+it.address+" "+it.city).indexOf(qq)>=0);
    });
  }
  function renderResults(){
    var list=filtered(), s=D.sections.filter(function(x){return x.key===sec;})[0];
    $("results").innerHTML='<div class="found">Found: '+list.length+' Propert'+(list.length===1?'y':'ies')+'</div>'+
      (list.length?list.map(function(it){return rowHtml(it,"rrow");}).join(""):'<div class="none">No properties match. Try “Any” or another city.</div>')+
      (s&&s.addItemLink?'<a class="addbtn" href="'+esc(s.addItemLink)+'" target="_blank" rel="noopener">＋ List Your Property</a>':'');
  }

  // ---------- map: Mapbox, same setup as the property-map repo ----------
  var MAPBOX_TOKEN="pk.eyJ1IjoicGV0ZXJ0b29uIiwiYSI6ImNtdDduZ3R4aTFxNmkyeXE3cWh0MDRkeWEifQ.syesHqacjBr298HCaXcihQ";
  var SAT="mapbox://styles/mapbox/satellite-streets-v12", STREET="mapbox://styles/mapbox/streets-v12";
  var mbMap=null, mapList=[], activeTypes={}, mapMissing=0, isSat=true, firstFit=true;
  function loadMapbox(cb){
    if(window.mapboxgl) return cb();
    var c=document.createElement("link"); c.rel="stylesheet"; c.href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css"; document.head.appendChild(c);
    var j=document.createElement("script"); j.src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"; j.onload=cb;
    j.onerror=function(){alert("The map couldn't load. Check your connection and try again.");}; document.head.appendChild(j);
  }
  function statusClass(st){ st=String(st||"").toLowerCase(); return st.indexOf("sale")>=0?"status-sale":st.indexOf("rent")>=0?"status-rent":/pending|hold/.test(st)?"status-pending":""; }
  function cardPrice(it){ return short(it).replace("/nt",it.priceSuffix&&it.priceNum?" /night":""); }
  function metaLine(it){
    var a=[]; if(it.beds) a.push(it.beds+" bd"); if(it.baths) a.push(it.baths+" ba"); if(it.sqft) a.push(fmt(it.sqft)+" sqft");
    if(it.acres) a.push(fmt(it.acres)+" acres"); if(it.sleeps) a.push("sleeps "+it.sleeps); return a.join(" | ");
  }
  function geojson(){
    return {type:"FeatureCollection",features:mapList.filter(function(it){return activeTypes[it.sec];}).map(function(it){
      return {type:"Feature",geometry:{type:"Point",coordinates:[it.lng,it.lat]},properties:{id:it.id,priceLabel:short(it),color:color(it.sec)}};
    })};
  }
  function addLayers(){
    if(mbMap.getSource("listings")) return;
    mbMap.addSource("listings",{type:"geojson",data:geojson(),cluster:true,clusterMaxZoom:13,clusterRadius:50});
    mbMap.addLayer({id:"clusters",type:"circle",source:"listings",filter:["has","point_count"],
      paint:{"circle-color":"#b3121a","circle-radius":["step",["get","point_count"],18,10,24,30,32],"circle-opacity":0.85}});
    mbMap.addLayer({id:"cluster-count",type:"symbol",source:"listings",filter:["has","point_count"],
      layout:{"text-field":["get","point_count_abbreviated"],"text-size":13},paint:{"text-color":"#fff"}});
    mbMap.addLayer({id:"unclustered-point",type:"circle",source:"listings",filter:["!",["has","point_count"]],
      paint:{"circle-color":["get","color"],"circle-radius":6,"circle-stroke-width":2,"circle-stroke-color":"#fff"}});
    mbMap.addLayer({id:"highlight",type:"circle",source:"listings",filter:["==",["get","id"],""],
      paint:{"circle-color":"#ffd24a","circle-radius":10,"circle-stroke-width":3,"circle-stroke-color":"#fff"}});
    mbMap.addLayer({id:"unclustered-price-label",type:"symbol",source:"listings",filter:["!",["has","point_count"]],
      layout:{"text-field":["get","priceLabel"],"text-size":12,"text-offset":[0,-1.6],"text-font":["DIN Pro Medium","Arial Unicode MS Bold"]},
      paint:{"text-color":["get","color"],"text-halo-color":"#fff","text-halo-width":1.5}});
  }
  function refreshData(fit){
    var src=mbMap.getSource("listings"); if(src) src.setData(geojson());
    if(fit){
      var pts=mapList.filter(function(it){return activeTypes[it.sec];});
      if(pts.length===1) mbMap.jumpTo({center:[pts[0].lng,pts[0].lat],zoom:13});
      else if(pts.length){ var b=new mapboxgl.LngLatBounds(); pts.forEach(function(it){b.extend([it.lng,it.lat]);}); mbMap.fitBounds(b,{padding:60,maxZoom:13,duration:0}); }
    }
    renderCardStrip();
  }
  function openMap(){
    var all=sec?filtered():D.items.filter(inArea);
    mapList=all.filter(function(it){return it.lat!=null&&it.lng!=null;});
    mapMissing=all.length-mapList.length;
    var s=D.sections.filter(function(x){return x.key===sec;})[0];
    $("mapTitle").textContent=(s?s.label:"All Properties")+(city?" — "+city:region?" — "+region:"");
    D.sections.forEach(function(x){ activeTypes[x.key]=!sec||x.key===sec; });
    $("filter-panel").innerHTML=D.sections.map(function(x){
      return '<label><input type="checkbox" class="type-toggle" value="'+esc(x.key)+'"'+(activeTypes[x.key]?' checked':'')+'><i style="background:'+esc(x.color||"#b3121a")+'"></i>'+esc(x.label.replace(/ Properties$/,"").replace("Vacation Homes & Venues","Vacation & Venues"))+'</label>';
    }).join("");
    $("bottom-panel").classList.remove("collapsed");
    $("mapWrap").classList.remove("hide");
    loadMapbox(function(){
      mapboxgl.accessToken=MAPBOX_TOKEN;
      if(!mbMap){
        mbMap=new mapboxgl.Map({container:"map",style:SAT,center:[(D.mapCenter||[32.85,-102.63])[1],(D.mapCenter||[32.85,-102.63])[0]],zoom:9});
        mbMap.on("style.load",function(){ addLayers(); refreshData(firstFit); firstFit=false; });
        mbMap.on("moveend",renderCardStrip);
        // Tap a pin -> open the panel, scroll to its card and highlight it
        mbMap.on("click","unclustered-point",function(e){
          var id=e.features[0].properties.id;
          $("bottom-panel").classList.remove("collapsed");
          var card=$("card-strip").querySelector('.listing-card[data-id="'+id.replace(/"/g,"")+'"]');
          if(card) card.scrollIntoView({behavior:"smooth",inline:"start",block:"nearest"});
          highlightCard(id);
        });
        // Tap a cluster -> zoom in
        mbMap.on("click","clusters",function(e){
          var cid=e.features[0].properties.cluster_id;
          mbMap.getSource("listings").getClusterExpansionZoom(cid,function(err,zoom){ if(!err) mbMap.easeTo({center:e.features[0].geometry.coordinates,zoom:zoom}); });
        });
      } else {
        setTimeout(function(){ mbMap.resize(); refreshData(true); },60);
      }
    });
  }
  function highlightCard(id){
    Array.prototype.forEach.call(document.querySelectorAll(".listing-card"),function(c){c.classList.toggle("active",c.getAttribute("data-id")===id);});
    if(mbMap&&mbMap.getLayer("highlight")) mbMap.setFilter("highlight",["==",["get","id"],id||""]);
  }
  // Cards = properties inside the current map view
  function renderCardStrip(){
    if(!mbMap) return;
    // whole screen area (getBounds() can leave out the padded edges)
    var cv=mbMap.getCanvas(), w=cv.clientWidth, h=cv.clientHeight;
    var b=new mapboxgl.LngLatBounds(mbMap.unproject([0,h]), mbMap.unproject([w,0]));
    var visible=mapList.filter(function(it){return activeTypes[it.sec]&&b.contains([it.lng,it.lat]);});
    $("result-count").textContent=(visible.length?visible.length+" propert"+(visible.length===1?"y":"ies"):"No properties in view")+(mapMissing?" · "+mapMissing+" not on map yet":"");
    $("card-strip").innerHTML=visible.map(function(it){
      return '<button class="listing-card" data-id="'+esc(it.id)+'">'+
        '<div class="card-photo'+(it.image?'':' card-photo-fallback')+'">'+(it.image?'<img src="'+esc(it.image)+'" alt="" loading="lazy" onerror="this.parentElement.classList.add(\'card-photo-fallback\');this.remove();">':'')+'</div>'+
        '<div class="card-body"><div class="card-top-row"><div class="card-price">'+esc(cardPrice(it))+'</div>'+(it.listing?'<div class="card-status '+statusClass(it.listing)+'">'+esc(it.listing)+'</div>':'')+'</div>'+
        '<div class="card-meta">'+esc(metaLine(it)||it.type)+'</div><div class="card-address">'+esc(it.address||it.title)+'</div></div></button>';
    }).join("");
  }
  // Swiping the cards highlights the matching pin
  $("card-strip").addEventListener("scroll",function(){
    clearTimeout(this._t); var el=this;
    this._t=setTimeout(function(){
      var best=null,bd=1e9; Array.prototype.forEach.call(el.children,function(c){var d=Math.abs(c.offsetLeft-el.scrollLeft-12); if(d<bd){bd=d;best=c;}});
      if(best) highlightCard(best.getAttribute("data-id"));
    },120);
  });
  document.addEventListener("change",function(e){
    var t=e.target; if(!t.classList||!t.classList.contains("type-toggle")) return;
    activeTypes[t.value]=t.checked; refreshData(false);
  });
  $("styleBtn").onclick=function(){ if(!mbMap) return; isSat=!isSat; mbMap.setStyle(isSat?SAT:STREET); this.textContent=isSat?"Map":"Satellite"; };
  // Collapsible bottom panel: tap the handle, or swipe it up/down
  (function(){
    var panel=$("bottom-panel"), handle=$("panel-handle"), y0=null;
    handle.addEventListener("click",function(){panel.classList.toggle("collapsed");});
    handle.addEventListener("touchstart",function(e){y0=e.touches[0].clientY;},{passive:true});
    handle.addEventListener("touchend",function(e){ if(y0==null) return; var d=e.changedTouches[0].clientY-y0;
      if(d>25) panel.classList.add("collapsed"); else if(d<-25) panel.classList.remove("collapsed"); y0=null; });
  })();
  $("mapBar").onclick=openMap;
  $("mapClose").onclick=function(){$("mapWrap").classList.add("hide");};

  // ---------- popup ----------
  function openItem(id){
    var it=D.items.filter(function(x){return x.id===id;})[0]; if(!it) return;
    var tel=(it.phone||"").replace(/[^\d+]/g,""), share=location.origin+location.pathname+"?item="+encodeURIComponent(it.id);
    var s=D.sections.filter(function(x){return x.key===it.sec;})[0]||{};
    var facts=[["beds","Beds"],["baths","Baths"],["sqft","Sq Ft"],["acres","Acres"],["sleeps","Sleeps"]].filter(function(x){return it[x[0]];})
      .map(function(x){return '<div class="fact"><b>'+fmt(it[x[0]])+'</b><span>'+x[1]+'</span></div>';}).join("");
    var specs=it.specs.map(function(x){return '<div><b>'+esc(x[0])+':</b> '+esc(x[1])+'</div>';}).join("");
    var more=it.more.map(function(x){return '<div><b>'+esc(x[0])+':</b> '+esc(x[1])+'</div>';}).join("");
    var g=it.gallery||[];
    var dir=it.lat!=null?"https://maps.google.com/?q="+it.lat+","+it.lng:(it.address?"https://maps.google.com/?q="+encodeURIComponent(it.address):"");
    $("sheet").innerHTML='<div class="gal"><div class="strip">'+g.map(function(x){return '<img src="'+esc(x)+'" alt="">';}).join("")+'</div>'+(g.length>1?'<span class="cnt">'+g.length+' photos — swipe</span>':'')+'<button class="xb" data-close>×</button></div>'+
      '<div class="info"><h4>'+esc(it.title)+'</h4><div class="sub">'+esc([s.label,it.type,it.listing].filter(Boolean).join(" · "))+'</div>'+
      (it.price?'<div class="pp">'+esc(it.price)+(it.priceSuffix&&it.priceNum?' <small style="font-size:14px;color:var(--muted)">'+esc(it.priceSuffix)+'</small>':'')+'</div>':'')+
      '<div class="c" style="font-size:14px">'+(it.city?PIN+esc(it.city)+', TX':'')+(it.address?' &nbsp;'+esc(it.address):'')+'</div>'+
      (facts?'<div class="facts">'+facts+'</div>':'')+(specs?'<div class="specs">'+specs+'</div>':'')+(it.desc?'<p>'+esc(it.desc)+'</p>':'')+
      (more?'<details><summary>Show More</summary><div class="specs">'+more+'</div></details>':'')+
      '<div class="acts">'+
        (tel?'<a class="act main" href="tel:'+tel+'">☎ Call Agent</a><a class="act" href="sms:'+tel+'">Text</a>':'')+
        (it.email?'<a class="act" href="mailto:'+esc(it.email)+'?subject='+encodeURIComponent("Lokaal Properties: "+it.title)+'">✉ Email Agent</a>':'')+
        (dir?'<a class="act" target="_blank" rel="noopener" href="'+dir+'">Directions</a>':'')+
        (it.website?'<a class="act" target="_blank" rel="noopener" href="'+esc(it.website)+'">'+(it.sec==="vac"?"Book / Website":"Website")+'</a>':'')+
        (it.link?'<a class="act" target="_blank" rel="noopener" href="'+esc(it.link)+'">Full Listing</a>':'')+
        '<button class="act" data-share="'+esc(share)+'" data-title="'+esc(it.title)+'">Share</button>'+
        (it.seller?'<div class="seller">Agent: '+esc(it.seller)+'</div>':'')+
      '</div></div>';
    var acts=$("sheet").querySelectorAll(".act"); if(acts.length%2) acts[acts.length-1].classList.add("wide");
    $("pop").classList.add("open");
  }
  function closePop(){$("pop").classList.remove("open");}

  document.addEventListener("click",function(e){
    var t=e.target.closest("[data-sec],[data-id],[data-f],[data-close],[data-closebox],[data-share],[data-map]");
    if(!t){ if(e.target.id==="pop") closePop(); return; }
    if(t.tagName==="SELECT") return;
    if(t.hasAttribute("data-map")) return openMap();
    if(t.hasAttribute("data-close")) return closePop();
    if(t.hasAttribute("data-closebox")){ sec=""; setUrl(); render(); return; }
    if(t.hasAttribute("data-share")){ var u=t.getAttribute("data-share");
      if(navigator.share) navigator.share({title:t.getAttribute("data-title"),url:u}).catch(function(){});
      else if(navigator.clipboard) navigator.clipboard.writeText(u).then(function(){t.textContent="Link copied";}); return; }
    if(t.hasAttribute("data-sec")){ var k=t.getAttribute("data-sec"); sec=(sec===k?"":k); setUrl(); render();
      if(sec) setTimeout(function(){var b=$("box"); if(b) b.scrollIntoView({behavior:"smooth",block:"start"});},50); return; }
    if(t.hasAttribute("data-f")){ F[sec][t.getAttribute("data-f")]=t.getAttribute("data-v"); renderBox(); renderResults(); return; }
    if(t.hasAttribute("data-id")) openItem(t.getAttribute("data-id"));
  });
  function setUrl(){ try{ history.replaceState(null,"",sec?"?sec="+sec:location.pathname); }catch(e){} }

  var saved=store(AREA_KEY); if(saved){region=saved.region||"";city=saved.city||"";}
  fetch(API).then(function(r){return r.json();}).then(function(data){
    if(data.error) throw new Error(data.error);
    D=data; $("loading").classList.add("hide"); $("main").classList.remove("hide");
    var p=new URLSearchParams(location.search);
    if(p.get("sec")) sec=p.get("sec");
    var item=p.get("item"); if(item) sec=item.split(":")[0];
    if(p.get("map")) setTimeout(openMap,100);
    fillArea(); render(); if(item) openItem(item);
  }).catch(function(err){ $("loading").textContent="Couldn't load properties. "+(err&&err.message?err.message:""); });
})();
</script>
</body>
</html>
